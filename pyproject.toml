[build-system]
requires = ["setuptools>=61.0,<80"]
build-backend = "setuptools.build_meta"

[project]
name = "validkit"
version = "0.1.0"
description = "Python-Bibliothek für Prüf- und Normalisierungsfunktionen"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[tool.setuptools.packages.find]
include = ["validkit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
